<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ごはんチョイス | 献立おみくじ＆採点</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>ごはんチョイス</h1>
      <p>好きなものを食べる。悩まない食卓の相棒</p>
    </header>

    <main class="container">
      <!-- 月 → 週 → 日 切り替えタブ -->
      <nav class="view-tabs">
        <button id="tabMonth" class="tab-btn active">月表示</button>
        <button id="tabWeek" class="tab-btn">週表示</button>
        <button id="tabDay" class="tab-btn">日表示</button>
      </nav>

      <!-- 1. 月表示（初期画面） -->
      <section id="monthView" class="card">
        <h2>今月のサマリー（月表示）</h2>
        <div class="summary-box">
          <p>月間合計ポイント：<strong id="monthTotalScore">0</strong> pt</p>
          <p>
            現在の月間ランク：<strong id="monthRank" class="rank-badge"
              >ビギナー食卓</strong
            >
          </p>
        </div>
        <p id="monthReflection" class="reflection-text">
          まだ記録がありません。「日表示」から今日の食卓を採点してみよう！
        </p>
        <div id="monthCalendarGrid" class="calendar-grid"></div>
      </section>

      <!-- 2. 週表示 -->
      <section id="weekView" class="card hidden">
        <h2>今週の中間レポート（週表示）</h2>
        <div class="summary-box">
          <p>週間中間ポイント：<strong id="weekTotalScore">0</strong> pt</p>
          <p>記録日数：<strong id="weekCount">0</strong> 日</p>
        </div>
        <p id="weekReflection" class="reflection-text">
          今週のデータが溜まると、ここにアプリの採点と反省が表示されます。
        </p>
      </section>

      <!-- 3. 日表示（メイン操作画面） -->
      <section id="dayView" class="hidden">
        <div class="card">
          <h2>本日の食卓カスタム（日表示）</h2>

          <div class="form-group">
            <label for="daySelect">日付を選ぶ（今月）</label>
            <select id="daySelect"></select>
          </div>

          <div class="form-group">
            <label for="genre">1. ジャンルを選ぶ</label>
            <select id="genre">
              <option value="和食">和食</option>
              <option value="洋食">洋食</option>
              <option value="中華">中華</option>
              <option value="エスニック">エスニック</option>
            </select>
          </div>

          <div class="form-group">
            <label for="staple">2. 主食</label>
            <select id="staple">
              <option value="米">米</option>
              <option value="麺">麺</option>
              <option value="パン">パン</option>
              <option value="なし">なし</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mainDish">3. 主菜</label>
            <select id="mainDish">
              <option value="肉">肉</option>
              <option value="魚">魚</option>
              <option value="卵・大豆">卵・大豆</option>
              <option value="野菜">野菜</option>
              <option value="なし">なし</option>
            </select>
          </div>

          <div class="form-group">
            <label for="sideDish">4. 副菜</label>
            <select id="sideDish">
              <option value="野菜">野菜</option>
              <option value="きのこ・海藻">きのこ・海藻</option>
              <option value="なし">なし</option>
            </select>
          </div>

          <div class="form-group">
            <label for="soup">5. 汁物</label>
            <select id="soup">
              <option value="あり">汁物あり</option>
              <option value="なし">なし</option>
            </select>
          </div>

          <div class="form-group">
            <label for="memo">ひとことメモ（任意）</label>
            <input
              type="text"
              id="memo"
              placeholder="例：シフト明けでサクッと決定！"
            />
          </div>
          <button type="button" id="randomBtn" class="secondary-btn">
            🎲 おまかせで選ぶ
          </button>
          <button id="judgeBtn" class="primary-btn">
            🎲 採点してこの日に記録する！
          </button>
        </div>

        <div id="resultArea" class="card result-card hidden">
          <h2>採点＆おみくじ結果</h2>
          <p id="scoreText" class="score">-- 点</p>
          <p id="fortuneText" class="fortune">判定待ち</p>
          <p id="commentText" class="comment"></p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
